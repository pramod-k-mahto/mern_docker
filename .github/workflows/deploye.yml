name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/docker
            git pull origin main
            docker-compose down
            docker-compose up -d --build



  # Get-Content $env:USERPROFILE\.ssh\id_ed25519.pub-- to see key 
  # ssh-keygen -t ed25519 -C "your-email@example.com" -- to create key 
